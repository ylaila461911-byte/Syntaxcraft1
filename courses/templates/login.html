<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Syntaxcraft</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: right;
        }
        .auth-container h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .auth-btn {
            width: 100%;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        .auth-btn:hover { background-color: #2980b9; }
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
        .error-message { color: #e74c3c; font-size: 13px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>تسجيل الدخول</h2>
        
        <!-- عرض رسائل الخطأ لو كلمة السر أو اسم المستخدم غلط -->
        {% if messages %}
            {% for message in messages %}
                <div class="error-message">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label>اسم المستخدم أو البريد الإلكتروني</label>
                <input type="text" name="username" required placeholder="ادخلي اسم المستخدم">
            </div>
            
            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" name="password" required placeholder="******">
            </div>

            <button type="submit" class="auth-btn">دخول</button>
        </form>
    </div>

</body>
</html>
